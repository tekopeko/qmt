{% extends "base.html" %}
{% block title %}Registracija — QMT{% endblock %}
{% block content %}
<div style="max-width:400px; margin: 8vh auto 0;">
  <h1 style="font-size:2rem; margin-bottom:4px;">Registracija</h1>
  <p class="hint" style="margin-bottom:22px;">Račun mogu otvoriti samo pozvani članovi.</p>
  <form method="post" action="/signup">
    <div class="field"><label for="name">Ime (neobavezno)</label><input id="name" type="text" name="name" autocomplete="name" placeholder="npr. Ivan Horvat"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Lozinka (barem 8 znakova)</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required></div>
    <button type="submit" class="btn-signal" style="width:100%; padding:12px;">Otvori račun</button>
  </form>
  <p class="hint" style="margin-top:16px;">Već imaš račun? <a href="/login">Prijavi se</a>.</p>
</div>
{% endblock %}
