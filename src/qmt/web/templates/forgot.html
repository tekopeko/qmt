{% extends "base.html" %}
{% block title %}Zaboravljena lozinka — QMT{% endblock %}
{% block content %}
<div style="max-width:400px; margin:8vh auto 0;">
  <h1 style="font-size:1.8rem; margin-bottom:4px;">Nova lozinka</h1>
  <p class="hint" style="margin-bottom:22px;">Upiši email — poslat ćemo ti link za postavljanje nove lozinke.</p>
  <form method="post" action="/forgot">
    <div class="field"><label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="email" required autofocus></div>
    <button type="submit" style="width:100%; padding:12px;">Pošalji link</button>
  </form>
  <p class="hint" style="margin-top:16px;"><a href="/login">← natrag na prijavu</a></p>
</div>
{% endblock %}
