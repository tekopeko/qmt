# /opt/webhost/docker-compose.yml on the webhost box: QMT, mojimakrosi and
# their Postgres. infra/deploy.sh copies infra/compose/ to /opt/webhost/ and
# places every other file named here (absolute paths on purpose):
#
#   /opt/webhost/db.env            <- infra/env/db.env            (mode 600)
#   /opt/webhost/qmt.env           <- infra/env/qmt.env           (mode 600)
#   /opt/webhost/mojimakrosi.env   <- infra/env/mojimakrosi.env   (mode 600)
#   /opt/webhost/qmt/              <- this repo (rsync)
#   /opt/webhost/mojimakrosi/      <- ../macro_tracker (rsync)
#   /opt/webhost/initdb/           <- infra/compose/initdb/
#
# The apps' ports bind 127.0.0.1 only: Caddy on the host is the one way in.
# Docker's published ports bypass ufw, so nothing here may publish on 0.0.0.0,
# and Postgres publishes nothing at all.
name: webhost

x-logging: &logging
  # Capped json-file logs: unbounded growth must not fill the 20 GB disk the
  # databases live on.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-healthz: &healthz
  # The trader's probe: a 200 from /healthz proves uvicorn serves. Unhealthy
  # gets restarted by the host's autoheal cron (cloud-init); deploy.sh waits
  # for "healthy" before it calls a deploy good. start_interval probes every
  # 5 s while the app boots (alembic upgrade head runs first).
  test: ["CMD", "python", "-c", "import urllib.request,sys\ntry:\n urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)\nexcept Exception:\n sys.exit(1)"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

services:
  db:
    image: postgres:18
    # POSTGRES_PASSWORD, plus QMT_DB_PASSWORD / MM_DB_PASSWORD for initdb.
    env_file: /opt/webhost/db.env
    volumes:
      # postgres:18 keeps its data in /var/lib/postgresql/18/docker and
      # declares /var/lib/postgresql as the volume (up to 17: .../data).
      - pgdata:/var/lib/postgresql
      # Runs once, while pgdata is empty: the roles and databases qmt and
      # mojimakrosi (initdb/01-roles.sh).
      - /opt/webhost/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: while initdb runs, the server listens on its
      # socket only, so "healthy" waits until the roles exist and 5432 is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  qmt:
    build: /opt/webhost/qmt
    image: webhost-qmt:latest
    env_file: /opt/webhost/qmt.env
    environment:
      # Trust Caddy's X-Forwarded-Proto (uvicorn trusts only 127.0.0.1 by
      # default, and Caddy's requests arrive from the Docker bridge), so the
      # app sees https. Safe: this port is reachable from the host only.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *healthz
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  mojimakrosi:
    build: /opt/webhost/mojimakrosi
    image: webhost-mojimakrosi:latest
    env_file: /opt/webhost/mojimakrosi.env
    environment:
      # As for qmt; here it also makes the verification and reset links in
      # emails https (mojimakrosi builds them with request.url_for).
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *healthz
    restart: unless-stopped
    # More room than qmt: it decodes and resizes food photos in memory (Pillow).
    mem_limit: 768m
    logging: *logging

volumes:
  pgdata:
